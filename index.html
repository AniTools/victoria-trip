<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victoria Trip</title>
<style>
  :root {
    --ink: #F5F1E8;
    --forest: #1B4B43;
    --forest-deep: #123531;
    --coral: #E07856;
    --gold: #C9A876;
    --cream: #FAF6EF;
    --line: #E5DCC8;
    --text: #2B3A36;
    --muted: #8C9490;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html, body {
    background: var(--cream);
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: var(--text);
    font-size: 19px;
    line-height: 1.5;
    overflow-x: hidden;
    overflow-wrap: break-word;
  }
  body { max-width: 620px; margin: 0 auto; }

  header { background: var(--forest); color: var(--ink); padding: 32px 22px 24px 22px; }
  header .kicker {
    font-family: Georgia, serif; font-style: italic;
    font-size: 16px; color: var(--gold); margin-bottom: 8px;
  }
  header h1 {
    font-family: Georgia, serif; font-weight: normal;
    font-size: 32px; line-height: 1.2; margin-bottom: 8px;
  }
  header .dates { font-size: 17px; color: #CFE0DA; }
  header .hotel {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--forest-deep);
    font-size: 15px; color: #B9CFC8;
  }
  header .hotel strong { color: var(--ink); }

  .lang-toggle { display: flex; gap: 8px; margin-top: 18px; }
  .lang-toggle button {
    flex: 1; padding: 13px 0; border-radius: 8px;
    border: 1px solid var(--forest-deep); background: transparent;
    color: #B9CFC8; font-size: 16px; font-weight: 600; letter-spacing: 0.5px;
  }
  .lang-toggle button.active { background: var(--gold); color: var(--forest-deep); border-color: var(--gold); }

  .day-tabs { display: flex; background: var(--forest-deep); position: sticky; top: 0; z-index: 10; }
  .day-tabs button {
    flex: 1; padding: 16px 4px; background: transparent; border: none;
    color: #8FAAA2; font-size: 15.5px; font-weight: 600;
    font-family: -apple-system, Arial, sans-serif;
    border-bottom: 3px solid transparent;
  }
  .day-tabs button.active { color: var(--ink); border-bottom: 3px solid var(--coral); }

  main { padding: 20px 16px 44px 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- itinerary item: text left, BIG photo right ---- */
  .item {
    display: flex; gap: 14px; padding: 18px 0;
    border-bottom: 1px solid var(--line); align-items: flex-start;
  }
  .item .body { flex: 1; min-width: 0; }
  .item .time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .item .time { font-family: Georgia, serif; font-weight: bold; color: var(--forest); font-size: 16.5px; }
  .item .icon { font-size: 19px; }
  .item .title { font-size: 18px; color: var(--text); }
  .item .title strong { color: var(--forest); }
  .item .tag {
    display: inline-block; margin-top: 6px; font-size: 12.5px;
    letter-spacing: 0.5px; color: var(--coral); font-weight: 700;
  }
  .item a.maplink {
    display: block; margin-top: 8px; font-size: 14.5px;
    color: var(--muted); text-decoration: none;
    border-bottom: 1px solid var(--line); padding-bottom: 3px;
  }
  .item .photo-wrap {
    width: 118px; height: 118px; flex-shrink: 0;
    border-radius: 14px; overflow: hidden; background: var(--line);
    display: block; text-decoration: none;
  }
  .item .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .photo-wrap.placeholder {
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; background: #EFE8D8;
  }

  /* ---- map tab ---- */
  .map-frame {
    width: 100%; height: 320px; border: none;
    border-radius: 14px; margin-bottom: 8px; background: var(--line);
  }
  .map-note { font-size: 15px; color: var(--muted); margin: 12px 2px 20px 2px; line-height: 1.55; }
  .map-day-title {
    font-family: Georgia, serif; font-size: 20px; color: var(--forest);
    margin: 24px 0 12px 0; padding-bottom: 8px; border-bottom: 2px solid var(--coral);
  }
  a.place-btn {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 15px; margin-bottom: 9px;
    background: #fff; border: 1px solid var(--line); border-radius: 11px;
    text-decoration: none; color: var(--text); font-size: 17px;
  }
  a.place-btn > span:not(.pin):not(.arrow):not(.step-num) { flex: 1; min-width: 0; }
  a.place-btn .pin { font-size: 21px; flex-shrink: 0; }
  a.place-btn .arrow { margin-left: auto; color: var(--muted); font-size: 16px; flex-shrink: 0; }
  a.place-btn .step-num {
    flex-shrink: 0; width: 25px; height: 25px; border-radius: 50%;
    background: var(--forest); color: var(--ink);
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  a.route-btn {
    display: block; text-align: center; text-decoration: none;
    background: var(--forest); color: var(--ink);
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
    padding: 14px 14px; border-radius: 11px; margin: 2px 0 14px 0;
  }

  .notes {
    margin-top: 26px; background: #F0E9D8;
    border-left: 3px solid var(--gold); padding: 18px 20px; border-radius: 4px;
  }
  .notes .notes-title { font-family: Georgia, serif; font-size: 16.5px; color: var(--forest); margin-bottom: 10px; }
  .notes li { font-size: 15px; color: #4A5652; margin-bottom: 7px; margin-left: 18px; line-height: 1.55; }

  footer { text-align: center; font-size: 12.5px; color: var(--muted); padding: 26px 0 10px 0; letter-spacing: 0.5px; }
</style>
</head>

</header>

</main>

const mapUrl = v => (v && v.slice(0, 2) === "q:")
  ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v.slice(2))
  : "https://www.google.com/maps/place/?q=place_id:" + v;

// ordered stops [pin, name, query] -> a Google Maps directions URL that draws the route
const dirUrl = stops => "https://www.google.com/maps/dir/" +
  stops.map(s => encodeURIComponent((s[2].slice(0, 2) === "q:" ? s[2].slice(2) : s[1]))).join("/");

// ordered stops -> embeddable map that shows the route line (no API key needed)
const routeEmbed = stops => {
  const clean = s => encodeURIComponent(s[2].slice(0, 2) === "q:" ? s[2].slice(2) : s[1]);
  const saddr = clean(stops[0]);
  const daddr = stops.slice(1).map(clean).join("+to:");
  return "https://maps.google.com/maps?saddr=" + saddr + "&daddr=" + daddr + "&output=embed";
};

function renderDay(items, linkLabel) {
  return items.map(([time, icon, title, tag, placeId, photo]) => `
    <div class="item">
      <div class="body">
        <div class="time-row"><span class="time">${time}</span><span class="icon">${icon}</span></div>
        <div class="title">${title}</div>
        ${tag ? `<div class="tag">${tag}</div>` : ""}
        ${placeId ? `<a class="maplink" href="${mapUrl(placeId)}" target="_blank" rel="noopener">${linkLabel}</a>` : ""}
      </div>
      ${photo
        ? `<a class="photo-wrap" href="${placeId ? mapUrl(placeId) : '#'}" target="_blank" rel="noopener"><img src="${photo}" loading="lazy" alt=""></a>`
        : `<div class="photo-wrap placeholder">${icon}</div>`}
    </div>
  `).join("");
}

function renderMap(d) {
  const stops = list => list.map(([pin, name, id], i) => `
    <a class="place-btn" href="${mapUrl(id)}" target="_blank" rel="noopener">
      <span class="step-num">${i + 1}</span>
      <span class="pin">${pin}</span><span>${name}</span><span class="arrow">›</span>
    </a>`).join("");
  const dayBlock = (titleTxt, route) => `
    <div class="map-day-title">${titleTxt}</div>
    <iframe class="map-frame" loading="lazy" allowfullscreen
      src="${routeEmbed(route)}"></iframe>
    <a class="route-btn" href="${dirUrl(route)}" target="_blank" rel="noopener">${d.routeBtn}</a>
    ${stops(route)}
  `;
  return `
    <div class="map-note">${d.mapNote}</div>
    ${dayBlock(d.mapDay1, d.route1)}
    ${dayBlock(d.mapDay2, d.route2)}
  `;
}

let currentLang = 'es', currentTab = 1;

function setLang(lang) {
  currentLang = lang;
  const d = DATA[lang];
  document.getElementById('kicker').textContent = d.kicker;
  document.getElementById('title').innerHTML = d.title;
  document.getElementById('dates').textContent = d.dates;
  document.getElementById('checkLabel').textContent = d.checkLabel;
  document.getElementById('tab1').textContent = d.tab1;
  document.getElementById('tab2').textContent = d.tab2;
  document.getElementById('tab3').textContent = d.tab3;
  document.getElementById('notesTitle').textContent = d.notesTitle;
  document.getElementById('notesList').innerHTML = d.notes.map(n => `<li>${n}</li>`).join("");
  document.getElementById('panel1').innerHTML = renderDay(d.day1, d.mapLink);
  document.getElementById('panel2').innerHTML = renderDay(d.day2, d.mapLink);
  document.getElementById('panel3').innerHTML = renderMap(d);
  document.getElementById('btnEs').classList.toggle('active', lang === 'es');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
}

function setTab(n) {
  currentTab = n;
  for (let i = 1; i <= 3; i++) {
    document.getElementById('panel' + i).classList.toggle('active', i === n);
    document.getElementById('tab' + i).classList.toggle('active', i === n);
  }
  document.getElementById('notesBox').style.display = (n === 3) ? 'none' : 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

setLang('es');
setTab(1);
</script>
